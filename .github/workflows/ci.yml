name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify compiler contracts and self-map
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify viewer behavior
        run: npm run test:viewer:ci

      - name: CLI smoke
        run: |
          node dist/cli.js --help
          node dist/cli.js scan . --output "$RUNNER_TEMP/underdelta-smoke"

      - name: Public bootstrap cold and warm cache
        run: bash scripts/test-bootstrap.sh
