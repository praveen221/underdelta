# Mini GraphQL notes schema — Query + Mutation fields for verify smoke floors.
type Query {
  notes: [Note!]!
  note(id: ID!): Note
  tags: [Tag!]!
}

type Mutation {
  createNote(title: String!, body: String): Note!
  deleteNote(id: ID!): Boolean!
}

type Note {
  id: ID!
  title: String!
  body: String
  tags: [Tag!]!
}

type Tag {
  id: ID!
  name: String!
}
