services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - api
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
