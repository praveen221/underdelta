openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: Mini OpenAPI notes fixture for Underdelta verification.
paths:
  /notes:
    get:
      summary: List notes
      operationId: listNotes
      responses:
        "200":
          description: A list of notes
    post:
      summary: Create note
      operationId: createNote
      responses:
        "201":
          description: Note created
  /notes/{id}:
    get:
      summary: Get note
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single note
    delete:
      summary: Delete note
      operationId: deleteNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Note deleted
